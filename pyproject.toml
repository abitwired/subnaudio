[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subnaudio"
version = "0.1.0"
description = "Unsupervised ML classifier for underwater aquatic sounds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "soundfile>=0.12.0",
    "audioread>=3.0.0",
]

[project.scripts]
subnaudio = "subnaudio.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["subnaudio*"]
